<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shohcoins</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b12;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 20px;
        }

        .coin {
            font-size: 70px;
        }

        h1 {
            font-size: 48px;
            margin: 5px 0;
        }

        .subtitle {
            color: #aaa;
            font-size: 20px;
        }

        .balance {
            margin-top: 40px;
            padding: 30px;
            border-radius: 30px;
            background: #171720;
            border: 1px solid #30303d;
        }

        .balance-title {
            color: #aaa;
            font-size: 20px;
        }

        #balance {
            font-size: 70px;
            font-weight: bold;
            color: #ffc928;
            margin: 10px;
        }

        .click-btn {
            width: 100%;
            margin-top: 35px;
            padding: 55px 20px;
            border: none;
            border-radius: 35px;
            background: linear-gradient(135deg, #ffc928, #ff9f1c);
            font-size: 32px;
            font-weight: bold;
            color: #111;
            cursor: pointer;
            box-shadow: 0 10px 35px rgba(255, 190, 30, 0.25);
        }

        .click-btn:active {
            transform: scale(0.97);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }

        .stat {
            flex: 1;
            background: #171720;
            border: 1px solid #30303d;
            border-radius: 25px;
            padding: 25px 10px;
        }

        .number {
            font-size: 35px;
            font-weight: bold;
        }

        .label {
            color: #999;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <div class="coin">🪙</div>

    <h1>Shohcoins</h1>
    <div class="subtitle">Klik qiling va SHC yig‘ing!</div>

    <div class="balance">
        <div class="balance-title">Sizning balansingiz</div>
        <div id="balance">0</div>
        <div class="balance-title">SHC COINS</div>
    </div>

    <button class="click-btn" onclick="addCoin()">
        🪙<br>
        +1 SHC
    </button>

    <div class="stats">
        <div class="stat">
            <div class="number" id="clicks">0</div>
            <div class="label">Jami kliklar</div>
        </div>

        <div class="stat">
            <div class="number">SHC</div>
            <div class="label">Valyuta</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        let telegramId = "test_user";

        if (tg.initDataUnsafe &&
            tg.initDataUnsafe.user &&
            tg.initDataUnsafe.user.id) {
            telegramId = String(tg.initDataUnsafe.user.id);
        }

        async function loadUser() {
            try {
                const response = await fetch(
                    "/user?telegram_id=" + encodeURIComponent(telegramId)
                );

                const data = await response.json();

                document.getElementById("balance").textContent = data.balance;
                document.getElementById("clicks").textContent = data.clicks;

            } catch (error) {
                console.log("User yuklashda xato:", error);
            }
        }

        async function addCoin() {
            try {
                const response = await fetch("/click", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        telegram_id: telegramId
                    })
                });

                const data = await response.json();

                document.getElementById("balance").textContent = data.balance;
                document.getElementById("clicks").textContent = data.clicks;

            } catch (error) {
                console.log("Klik xatosi:", error);
            }
        }

        loadUser();
    </script>

</body>
</html>
