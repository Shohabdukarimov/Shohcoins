<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shohcoin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            margin: 0;
            padding: 25px;
            background: #0d0d14;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-top: 30px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        .balance {
            background: #181820;
            border-radius: 30px;
            padding: 35px 15px;
            margin-bottom: 25px;
        }

        .title {
            color: #aaa;
            font-size: 18px;
        }

        #balance {
            color: #ffc107;
            font-size: 70px;
            font-weight: bold;
            margin: 10px;
        }

        .click {
            width: 100%;
            height: 180px;
            border: 0;
            border-radius: 35px;
            background: linear-gradient(135deg, #ffc107, #ff9800);
            font-size: 35px;
            font-weight: bold;
        }

        .stats {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        .stat {
            flex: 1;
            background: #181820;
            border-radius: 25px;
            padding: 25px 5px;
        }

        .number {
            font-size: 35px;
            font-weight: bold;
        }

        .label {
            color: #999;
            margin-top: 8px;
        }

        #user {
            margin-top: 25px;
            color: #888;
            font-size: 14px;
            word-break: break-all;
        }

        #error {
            color: #ff5555;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>🪙 Shohcoin</h1>

    <div class="subtitle">
        Klik qiling va SHC yig‘ing!
    </div>

    <div class="balance">
        <div class="title">Sizning balansingiz</div>
        <div id="balance">0</div>
        <div class="title">SHC COINS</div>
    </div>

    <button class="click" onclick="addCoin()">
        🪙<br>+1 SHC
    </button>

    <div class="stats">

        <div class="stat">
            <div class="number" id="clicks">0</div>
            <div class="label">Jami kliklar</div>
        </div>

        <div class="stat">
            <div class="number">SHC</div>
            <div class="label">Valyuta</div>
        </div>

    </div>

    <div id="user">Telegram foydalanuvchisi aniqlanmoqda...</div>

    <div id="error"></div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const initData = tg.initData;


async function authenticate() {

    if (!initData) {
        document.getElementById("error").innerText =
            "Saytni Telegram bot ichidan oching.";
        return false;
    }

    try {

        const response = await fetch("/auth", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                initData: initData
            })
        });

        const data = await response.json();

        if (!response.ok) {
            document.getElementById("error").innerText =
                data.error || "Telegram autentifikatsiya xatosi";
            return false;
        }

        document.getElementById("user").innerText =
            "Telegram ID: " + data.telegram_id;

        document.getElementById("balance").innerText =
            data.balance;

        document.getElementById("clicks").innerText =
            data.clicks;

        return true;

    } catch (error) {

        document.getElementById("error").innerText =
            "Server bilan aloqa xatosi";

        return false;
    }
}


async function addCoin() {

    try {

        const response = await fetch("/click", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            }
        });

        const data = await response.json();

        if (!response.ok) {
            document.getElementById("error").innerText =
                data.error || "Xatolik";
            return;
        }

        document.getElementById("balance").innerText =
            data.balance;

        document.getElementById("clicks").innerText =
            data.clicks;

    } catch (error) {

        document.getElementById("error").innerText =
            "Klikda xatolik";
    }
}


authenticate();

</script>

</body>
</html>
