<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShohCoin</title>

    <style>
        body {
            margin: 0;
            background: #0d0d14;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-top: 30px;
        }

        .subtitle {
            color: #aaa;
            font-size: 18px;
        }

        .balance {
            margin: 30px 20px;
            padding: 35px 20px;
            background: #191923;
            border-radius: 30px;
        }

        .balance h2 {
            color: #aaa;
            font-weight: normal;
        }

        #balance {
            font-size: 70px;
            color: #ffc21c;
            font-weight: bold;
        }

        #click-btn {
            width: 90%;
            max-width: 600px;
            height: 180px;
            border: none;
            border-radius: 35px;
            background: #ffb914;
            color: #111;
            font-size: 38px;
            font-weight: bold;
        }

        #click-btn:active {
            transform: scale(0.97);
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 25px 20px;
        }

        .stat {
            background: #191923;
            padding: 25px;
            border-radius: 25px;
            flex: 1;
            font-size: 25px;
        }

        .leaderboard {
            margin: 30px 20px;
            background: #191923;
            border-radius: 25px;
            padding: 20px;
        }

        .player {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #333;
            font-size: 18px;
        }

        .rank {
            color: #ffc21c;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>💰 ShohCoin</h1>
    <div class="subtitle">Klik qiling va SHC yig‘ing!</div>

    <div class="balance">
        <h2>Sizning balansingiz</h2>
        <div id="balance">0</div>
        <h2>SHC COINS</h2>
    </div>

    <button id="click-btn">🪙 +1 SHC</button>

    <div class="stats">
        <div class="stat">
            <b id="clicks">0</b>
            <br>
            <small>Jami kliklar</small>
        </div>

        <div class="stat">
            <b>SHC</b>
            <br>
            <small>Valyuta</small>
        </div>
    </div>

    <div class="leaderboard">
        <h2>🏆 TOP SHC</h2>
        <div id="leaderboard">
            Yuklanmoqda...
        </div>
    </div>

    <div id="telegram-id"></div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const telegramId = tg.initDataUnsafe?.user?.id;

    async function loadUser() {
        if (!telegramId) return;

        const response = await fetch(
            `/user?telegram_id=${telegramId}`
        );

        const data = await response.json();

        document.getElementById("balance").textContent = data.balance;
        document.getElementById("clicks").textContent = data.clicks;
        document.getElementById("telegram-id").textContent =
            "Telegram ID: " + telegramId;
    }

    document.getElementById("click-btn").onclick = async function () {

        if (!telegramId) {
            alert("Telegram orqali oching!");
            return;
        }

        const response = await fetch("/click", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                telegram_id: telegramId
            })
        });

        const data = await response.json();

        document.getElementById("balance").textContent = data.balance;
        document.getElementById("clicks").textContent = data.clicks;

        loadLeaderboard();
    };

    async function loadLeaderboard() {

        const response = await fetch("/leaderboard");
        const users = await response.json();

        const box = document.getElementById("leaderboard");

        box.innerHTML = "";

        users.slice(0, 100).forEach((user, index) => {

            const row = document.createElement("div");

            row.className = "player";

            row.innerHTML = `
                <span>
                    <span class="rank">#${index + 1}</span>
                    Telegram ${user.telegram_id}
                </span>

                <b>${user.balance} SHC</b>
            `;

            box.appendChild(row);
        });
    }

    loadUser();
    loadLeaderboard();
</script>

</body>
</html>
